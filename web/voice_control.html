<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Home | Voice Lighting</title>
<style>
:root{font-family:system-ui,sans-serif;color-scheme:dark;background:#0f172a;color:#f8fafc}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;box-sizing:border-box}
main{width:min(100%,440px);background:#1e293b;border:1px solid #334155;border-radius:22px;padding:28px;box-sizing:border-box;box-shadow:0 20px 60px #0005}
h1{font-size:1.5rem;margin:0 0 12px;color:#7dd3fc}
p{line-height:1.5;color:#cbd5e1}label{display:block;margin-top:16px;font-size:.9rem}
input{width:100%;padding:12px;border-radius:9px;border:1px solid #64748b;background:#0f172a;color:white;box-sizing:border-box}
button{margin-top:18px;padding:12px 18px;border:0;border-radius:30px;background:#38bdf8;color:#082f49;font-weight:700;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}#status{min-height:3em}small{color:#94a3b8}
</style>
</head>
<body><main>
<h1>🎙️ Smart Home Voice Control</h1>
<p>Say <strong>turn light on</strong> or <strong>turn light off</strong> to send a command to your configured Node-RED gateway.</p>
<label for="gateway">Gateway URL (local or HTTPS)</label>
<input id="gateway" type="url" value="http://localhost:1880/mqtt-command" autocomplete="off">
<button id="start" type="button">Start listening</button>
<p id="status" role="status" aria-live="polite">Ready to receive commands.</p>
<small>Requires microphone permission, a supported browser, and a running, protected Node-RED gateway. Do not enter secrets in this page.</small>
</main><script>
const button=document.querySelector('#start'), status=document.querySelector('#status'), gateway=document.querySelector('#gateway');
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
function message(value){status.textContent=value;}
if(!SpeechRecognition){button.disabled=true;message('Speech recognition is unavailable in this browser.');}
else{
 const recognition=new SpeechRecognition();
 recognition.lang='en-US';recognition.interimResults=false;recognition.maxAlternatives=1;
 recognition.onstart=()=>{button.disabled=true;message('Listening…');};
 recognition.onend=()=>{button.disabled=false;};
 recognition.onerror=e=>message('Microphone error: '+e.error);
 recognition.onresult=async event=>{
  const transcript=event.results[0][0].transcript.toLowerCase().trim();
  const command=/\bturn (the )?light on\b/.test(transcript)?'ON':/\bturn (the )?light off\b/.test(transcript)?'OFF':null;
  if(!command){message('Unsupported command: '+transcript);return;}
  let url;
  try{url=new URL(gateway.value);if(!['http:','https:'].includes(url.protocol))throw Error('Invalid protocol');}
  catch(_){message('Enter a valid HTTP(S) gateway URL.');return;}
  if(url.protocol==='http:'&&!['localhost','127.0.0.1'].includes(url.hostname)){message('Remote gateways must use HTTPS.');return;}
  message('Sending '+command+'…');
  try{
   const response=await fetch(url.toString(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({payload:command})});
   if(!response.ok)throw Error('HTTP '+response.status);
   message('Gateway accepted command: '+command);
  }catch(e){message('Command failed: '+e.message);}
 };
 button.addEventListener('click',()=>{try{recognition.start();}catch(e){message(e.message);}});
}
</script></body></html>
